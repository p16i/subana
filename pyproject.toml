[project]
name = "subana"
version = "0.0.3"
description = "Neural subspace analysis."
authors = [{ name = "Pat Chormai", email = "pat.chormai@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "torch>=2.7.1,<3",
    "tqdm>=4.67.1,<5",
    "numpy>=2.3.1,<3",
    "scipy>=1.16.0,<2",
    "torchvision>=0.22.1,<0.23",
    "torchmetrics>=1.8.0,<2",
    "pandas>=2.3.1,<3",
]

[project.urls]
Repository = "https://github.com/p16i/neural-subspace-analysis"
Documentation = "https://p16i.github.io/neural-subspace-analysis/"

[dependency-groups]
dev = [
    "pytest>=7.2.0,<8",
    "pytest-cov>=4.0.0,<5",
    "deptry>=0.16.2,<0.17",
    "mypy>=1.5.1,<2",
    "pre-commit>=3.4.0,<4",
    "tox>=4.11.1,<5",
    "tox-uv>=1.0.0",
    "ipykernel>=6.30.0,<7",
    "jupyter>=1.1.1,<2",
]
docs = [
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.2.7,<10",
    "mkdocstrings[python]>=0.26.1,<0.27",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subana"]

[tool.mypy]
files = ["nsa"]
disallow_untyped_defs = "True"
disallow_any_unimported = "True"
no_implicit_optional = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
lint.ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["nsa"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
